services:
    _defaults:
        autowire: true
        autoconfigure: true

    NS\UtilBundle\Form\Types\:
        resource: '../../Form/Types/'
        exclude: '../../Form/Types/ArraySource.php'

    NS\UtilBundle\Service\:
        resource: '../../Service/'

    NS\UtilBundle\Validator\Constraints\ArrayChoiceValidator: ~

    NS\UtilBundle\Service\Ajax:
        arguments:
            $template: '%ns_util.autocompleter_template%'

    # Keep existing service IDs available as aliases.
    ns_util.form.time:
        alias: NS\UtilBundle\Form\Types\TimeType

    ns_util.form.datetimepicker:
        alias: NS\UtilBundle\Form\Types\DateTimePicker

    ns_util.form.dateclockpicker:
        alias: NS\UtilBundle\Form\Types\DateClockPicker

    ns_util.form.clockpicker:
        alias: NS\UtilBundle\Form\Types\ClockPicker

    ns_util.form.datepicker:
        alias: NS\UtilBundle\Form\Types\DatePickerType

    ns_util.form.types.autocomplete:
        alias: NS\UtilBundle\Form\Types\Autocomplete

    ns.ajax_autocompleter:
        alias: NS\UtilBundle\Service\Ajax
